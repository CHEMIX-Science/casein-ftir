name: Tests and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            extras: test
          - os: windows-latest
            python: "3.12"
            extras: test
          - os: macos-latest
            python: "3.13"
            extras: test
          - os: ubuntu-latest
            python: "3.12"
            extras: "test,deconv,baseline"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[${{ matrix.extras }}]" build
      - run: python -m pytest
      - run: python -m build
      - run: python tools/smoke_wheel.py
