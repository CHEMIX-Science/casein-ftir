[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casein-ftir"
version = "0.2.0"
description = "CHEMIX — exploratory FTIR analysis for casein and the Galalithe project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ftir", "casein", "galalithe", "spectroscopy", "chemix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "matplotlib>=3.9"]

[project.optional-dependencies]
deconv = ["lmfit>=1.3"]
baseline = ["pybaselines>=1.1"]
jcamp = ["jcamp>=1.2.2"]
opus = ["brukeropusreader>=1.3.4"]
test = ["pytest>=8"]
all = ["lmfit>=1.3", "pybaselines>=1.1", "jcamp>=1.2.2", "brukeropusreader>=1.3.4", "pytest>=8"]

[project.scripts]
casein-ftir = "casein_ftir.cli:main"

[project.urls]
"CHEMIX" = "https://chemix-paris.com"
"Repository" = "https://github.com/CHEMIX-Science/casein-ftir"
"Issues" = "https://github.com/CHEMIX-Science/casein-ftir/issues"
"Documentation" = "https://github.com/CHEMIX-Science/casein-ftir#readme"

[tool.setuptools.packages.find]
include = ["casein_ftir*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
